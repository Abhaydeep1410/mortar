name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e "orchestrator[dev,tokens]"
      - name: Tests
        working-directory: orchestrator
        run: python -m pytest -q
      - name: Validate example blueprint
        working-directory: orchestrator
        run: python -m mortar.cli validate tests/fixtures/crm-01.blueprint.yaml
      - name: SKILL.md budgets (example and any registry modules)
        run: python tools/check_skill_budget.py docs/examples/SKILL.example.md registry

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build, test and install every registry module (authentication.jwt first; others depend on it)
        shell: bash
        run: |
          shopt -s nullglob
          all=(registry/*/module/pom.xml)
          if [ ${#all[@]} -eq 0 ]; then echo "no modules yet"; exit 0; fi
          base=registry/authentication.jwt/module/pom.xml
          poms=("$base")
          for pom in "${all[@]}"; do
            if [ "$pom" != "$base" ]; then poms+=("$pom"); fi
          done
          for pom in "${poms[@]}"; do
            echo "::group::$pom"
            mvn -B -ntp -f "$pom" install
            echo "::endgroup::"
          done
