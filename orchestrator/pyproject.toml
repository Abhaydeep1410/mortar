[project]
name = "mortar"
version = "0.1.0"
description = "Mortar: deterministic composition with LLM-guided planning for Spring Boot + React internal tools."
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6",
  "jsonschema>=4.21",
]

[project.optional-dependencies]
llm = ["litellm"]
mcp = ["mcp==2.3.0"]
dev = ["pytest>=8"]
tokens = ["tiktoken"]

[project.scripts]
mortar = "mortar.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mortar*"]

[tool.pytest.ini_options]
pythonpath = [".", "../tools", ".."]
testpaths = ["tests"]
