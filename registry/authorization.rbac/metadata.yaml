id: authorization.rbac
version: 1.0.0
category: authorization
display_name: Role-Based Access Control

provides:
  - interface: com.mortar.rbac.PermissionPolicy
    description: Answers whether a set of roles holds a permission on a resource
  - capability: authorization.rbac

requires:
  - capability: authentication.jwt

spring_boot: ">=4.0.0 <5.0.0"
java: ">=21"

conflicts_with: []

tags: [authorization, rbac, roles, permissions, "403", spring-security]

owns:
  imports:
    - org.springframework.security.access.prepost.
    - org.springframework.security.config.annotation.method.
