# Defaults from the Mortar deployment.docker module. Anything the application sets overrides these.

# GET /actuator/health answers {"status":"UP"} and nothing else is exposed.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true

# Flyway owns the module-provided tables (audit_log). Hibernate creates the application's own tables.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
